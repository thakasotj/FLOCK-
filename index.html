<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Flock Manager</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1F5C33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flock Manager">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  :root{
    --green-dark:#1F5C33;
    --green:#2F7A45;
    --green-soft:#E7F1E9;
    --page:#F5F7F3;
    --gold:#D9A93B;
    --cream:#FBF8F2;
    --ink:#1B2B22;
    --muted:#63756A;
    --line:#DCE6DE;
    --card:#FFFFFF;
    --danger:#C0503F;
    --ram:#2F7A45;
    --ewe:#E08B2A;
    --wether:#2C7A8B;
    --lamb:#C9587B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.brand{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--page);padding-bottom:40px;}

  header.top{
    background:linear-gradient(180deg,var(--green-dark),var(--green));
    padding:18px 16px 16px;
    position:sticky; top:0; z-index:10;
    border-bottom:3px solid var(--gold);
  }
  .top-row{display:flex;align-items:center;gap:10px;}
  .backBtn{
    background:rgba(255,255,255,0.15); border:none; color:#fff; width:34px;height:34px;
    border-radius:9px; font-size:18px; cursor:pointer; display:flex;align-items:center;justify-content:center;
  }
  .backBtn.hide{visibility:hidden;}
  header h1{color:#fff; font-size:21px; margin:0; font-weight:700;}
  .top-sub{color:#DCEEDF; font-size:12.5px; margin:4px 0 0 44px;}

  main{padding:16px;}

  /* Report hub grid */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .rcard{
    background:linear-gradient(180deg,var(--green),var(--green-dark));
    border-radius:14px; padding:18px 10px; text-align:center; cursor:pointer;
    border:none; color:#fff; display:flex;flex-direction:column;align-items:center;gap:10px;
    min-height:118px; justify-content:center;
  }
  .rcard span.label{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:600; font-size:14px; line-height:1.25;}
  .rcard .icon-wrap{width:44px;height:44px;display:flex;align-items:center;justify-content:center;}

  .stat-strip{display:flex; gap:10px; margin-bottom:16px;}
  .stat{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 10px; text-align:center;
  }
  .stat .n{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:22px; font-weight:700; color:var(--green-dark);}
  .stat .l{font-size:11px; color:var(--muted); margin-top:2px;}

  /* Common card / list */
  .card{background:var(--card); border:1px solid var(--line); border-radius:13px; padding:14px; margin-bottom:12px;}
  .row-between{display:flex; justify-content:space-between; align-items:center;}

  .btn{
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:600; font-size:14px; border:none; border-radius:9px;
    padding:11px 14px; cursor:pointer;
  }
  .btn-primary{background:var(--green); color:#fff;}
  .btn-primary:active{background:var(--green-dark);}
  .btn-outline{background:#fff; color:var(--green-dark); border:1px solid var(--green);}
  .btn-danger{background:#fff; color:var(--danger); border:1px solid var(--danger);}
  .btn-block{width:100%;}
  .btn-sm{padding:7px 10px; font-size:12.5px; border-radius:7px;}

  .searchbar{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .searchbar input{
    flex:1; padding:11px 12px; border-radius:9px; border:1px solid var(--line); font-size:14px; background:#fff;
  }
  .filter-row{display:flex; gap:10px; margin-bottom:12px;}
  .select-wrap{position:relative; flex:1;}
  .select-wrap select{
    width:100%; appearance:none; -webkit-appearance:none; -moz-appearance:none;
    padding:11px 30px 11px 12px; border:2px solid var(--green); border-radius:10px;
    color:var(--green-dark); font-weight:700; font-size:13px; background:#fff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .select-wrap::after{
    content:"▾"; position:absolute; right:12px; top:50%; transform:translateY(-50%);
    color:var(--green); font-size:13px; pointer-events:none;
  }
  .fab-add{
    position:fixed; bottom:22px; right:22px; z-index:20;
    background:linear-gradient(180deg,#F0A83A,#D9902A); color:#fff; border:none;
    padding:15px 24px; border-radius:30px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:700; font-size:15.5px;
    box-shadow:0 6px 16px rgba(217,144,42,0.45); cursor:pointer;
  }
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{
    padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:#fff; font-size:12.5px;
    cursor:pointer; color:var(--muted); font-weight:600;
  }
  .chip.active{background:var(--green); color:#fff; border-color:var(--green);}

  .sheep-item{
    display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-left:6px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer;
    position:relative;
  }
  .seqno{font-size:10.5px; font-weight:700; color:var(--muted); letter-spacing:0.3px; text-transform:uppercase;}
  .sheep-item .info{flex:1; min-width:0;}
  .sheep-item .tag{font-weight:700; font-size:15px;}
  .sheep-item .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .cat-tag{font-weight:800; font-size:12px; letter-spacing:0.2px;}
  .dot-btn{
    background:transparent; border:none; color:var(--muted); font-size:19px; line-height:1;
    cursor:pointer; padding:3px 6px; margin-top:2px;
  }
  .row-menu{
    position:absolute; right:8px; top:44px; background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.14); overflow:hidden; z-index:6; min-width:112px;
  }
  .row-menu button{
    display:block; width:100%; text-align:left; padding:10px 14px; border:none; background:#fff;
    font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .row-menu button:not(:last-child){border-bottom:1px solid var(--line);}
  .row-menu button.danger{color:var(--danger);}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; color:#fff;
  }
  .chev{color:var(--muted); font-size:18px;}

  label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:600;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); font-size:14.5px;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#fff;
  }
  textarea{resize:vertical; min-height:60px;}
  .cat-select{display:flex; gap:8px;}
  .cat-opt{
    flex:1; border:2px solid var(--line); border-radius:11px; padding:10px 4px; text-align:center; cursor:pointer;
    background:#fff;
  }
  .cat-opt.sel{border-color:var(--green); background:var(--green-soft);}
  .cat-opt .icon-wrap{display:flex; justify-content:center; margin-bottom:4px;}
  .cat-opt .cn{font-size:11.5px; font-weight:700;}

  .tabs{display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px; margin-bottom:14px;}
  .tabbtn{flex:1; border:none; background:transparent; padding:9px 0; border-radius:7px; font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .tabbtn.active{background:var(--green-soft); color:var(--green-dark);}

  .detail-hero{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .detail-hero .icon-wrap{width:72px;height:72px;flex:none;}
  .detail-hero h2{margin:0; font-size:20px;}
  .detail-hero .sub{font-size:12.5px; color:var(--muted); margin-top:2px;}

  .kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .kv{background:var(--green-soft); border-radius:10px; padding:10px;}
  .kv .k{font-size:11px; color:var(--muted); font-weight:600;}
  .kv .v{font-size:15px; font-weight:700; color:var(--green-dark); margin-top:2px;}

  .log-item{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
  .log-item:last-child{border-bottom:none;}
  .log-item .d{color:var(--muted); font-size:12px;}

  .empty{text-align:center; color:var(--muted); font-size:13.5px; padding:26px 10px;}

  .fab-add{margin-bottom:12px;}

  .form-actions{display:flex; gap:10px; margin-top:18px;}

  select[multiple]{height:auto;}

  .pill-status{padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700;}
  .st-open{background:#EDEFEA; color:var(--muted);}
  .st-bred{background:#FCEFD9; color:#9C6B12;}
  .st-confirmed{background:#E3EFE0; color:var(--green-dark);}
  .st-lambed{background:#DDEFE3; color:var(--green-dark);}

  .health-row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line);}
  .health-row:last-child{border-bottom:none;}
  .health-status{font-weight:800; font-size:12.5px;}
  .health-status.overdue{color:var(--danger);}
  .health-status.ok{color:var(--green-dark);}
  .health-alert-banner{background:#FBEAE7; border:1px solid #E4B3AA; border-radius:12px; padding:12px 14px; margin-bottom:14px;}
  .health-alert-banner .title{color:var(--danger); font-weight:800; font-size:13.5px; margin-bottom:6px;}
  .health-alert-row{display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--danger); cursor:pointer;}
  .health-badge-btn{
    display:block; width:100%; background:#FBEAE7; border:1px solid #E4B3AA; color:var(--danger);
    font-weight:700; font-size:12.5px; border-radius:12px; padding:12px 14px; margin-bottom:14px;
    text-align:left; cursor:pointer; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,0.55); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-sheet{
    width:100%; max-width:480px; background:#fff; border-radius:18px 18px 0 0; padding:20px 18px 26px;
    max-height:80vh; overflow-y:auto; box-shadow:0 -8px 24px rgba(0,0,0,0.2);
  }
  .modal-sheet h3{color:var(--danger); font-size:17px; margin:0 0 4px;}
  .modal-sheet .sub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}

  .stage-group h3{font-size:14px; margin:18px 0 8px; color:var(--green-dark);}
  .stage-group h3:first-child{margin-top:0;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <button class="backBtn" id="backBtn" onclick="goBack()">←</button>
      <h1 id="pageTitle">Flock Manager</h1>
    </div>
    <div class="top-sub" id="pageSub"></div>
  </header>
  <main id="main"></main>
  <div id="modalRoot"></div>
</div>

<script>
/* ---------------- Data ---------------- */
let sheepData = [];
let history = [];
let currentView = 'home';
let currentSheepId = null;
let editingSheepId = null;
let detailTab = 'overview';
let listFilter = 'all';
let listSearch = '';
let listBreedFilter = 'all';
let openMenuId = null;
let editingWeightId = null;
let editingEventId = null;
let editingBreedingId = null;
let pickEweTarget = null;
let editingTransactionId = null;
let bulkSelection = new Set();
let listSelection = new Set();
let healthModalOpen = false;
let healthAlertAutoShown = false;
let stageBuilder = {}; // temp for forms

const STAGE_DEFS = [
  {key:'Lamb', label:'Lamb', range:'0–3 months', minMo:0, maxMo:3},
  {key:'Weaner', label:'Weaner/Young Sheep', range:'3–12 months', minMo:3, maxMo:12},
  {key:'Yearling', label:'Yearling', range:'12–24 months', minMo:12, maxMo:24},
  {key:'Adult', label:'Adult', range:'24+ months', minMo:24, maxMo:Infinity}
];
const STAGES = STAGE_DEFS.map(d=>d.key);
function stageInfo(key){ return STAGE_DEFS.find(d=>d.key===key) || STAGE_DEFS[0]; }
function stageLabel(key){ return stageInfo(key).label; }
function stageRange(key){ return stageInfo(key).range; }
function stageFull(key){ return stageLabel(key) + ' (' + stageRange(key) + ')'; }
function monthsOld(dob){
  if(!dob) return null;
  const d0 = new Date(dob+'T00:00:00'), d1 = new Date();
  let months = (d1.getFullYear()-d0.getFullYear())*12 + (d1.getMonth()-d0.getMonth());
  if(d1.getDate() < d0.getDate()) months -= 1;
  return Math.max(0, months);
}
function computeStage(dob){
  const m = monthsOld(dob);
  if(m===null) return null;
  const def = STAGE_DEFS.find(d=> m>=d.minMo && m<d.maxMo);
  return def ? def.key : 'Adult';
}
function syncStages(){
  let changed = false;
  sheepData.forEach(s=>{
    const computed = computeStage(s.dob);
    if(computed && s.stage !== computed){
      s.stage = computed;
      s.stageHistory = s.stageHistory || [];
      s.stageHistory.push({date:todayStr(), stage:computed});
      changed = true;
    }
  });
  if(changed) saveData();
}
const CATS = {
  ewe:{label:'Ewe', color:'var(--ewe)', sex:'female'},
  ram:{label:'Ram', color:'var(--ram)', sex:'male'},
  wether:{label:'Wether', color:'var(--wether)', sex:'male'},
  femaleLamb:{label:'Lamb', color:'var(--femaleLamb)', sex:'female'},
  maleLamb:{label:'Lamb', color:'var(--maleLamb)', sex:'male'}
};
function catSex(category){ return (CATS[category] && CATS[category].sex) || 'female'; }
function countFemales(){ return sheepData.filter(s=>catSex(s.category)==='female').length; }
function countMales(){ return sheepData.filter(s=>catSex(s.category)==='male').length; }
const EVENT_TYPES = ['Vaccination','Pulpy Kidney Vaccine','Deworming','Shearing','Hoof Trim','Illness / Treatment','Injury','Weaning','Sold','Died','Other'];
const HEALTH_SCHEDULES = [
  {type:'Deworming', intervalDays:90},
  {type:'Pulpy Kidney Vaccine', intervalDays:365}
];
let presetEventType = null;

const TX_TYPES = [
  {type:'Sheep Sold', income:true},
  {type:'Sheep Bought', income:false},
  {type:'Wool/Milk Sold', income:true},
  {type:'Feed', income:false},
  {type:'Medication', income:false},
  {type:'Vaccine', income:false},
  {type:'Veterinary Services', income:false},
  {type:'Transport', income:false},
  {type:'Labor', income:false},
  {type:'Equipment/Supplies', income:false},
  {type:'Other Income', income:true},
  {type:'Other Expense', income:false}
];
function txIsIncome(type){ const t = TX_TYPES.find(x=>x.type===type); return t ? t.income : false; }
function formatLSL(amount){
  const n = Number(amount)||0;
  return 'M' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
function addDays(dateStr, days){
  const dt = new Date(dateStr+'T00:00:00');
  dt.setDate(dt.getDate()+days);
  return dt.toISOString().slice(0,10);
}
function ageStr(dob){
  if(!dob) return 'Unknown';
  const d0 = new Date(dob+'T00:00:00'), d1 = new Date();
  if(d0 > d1) return 'Not born yet';
  let years = d1.getFullYear() - d0.getFullYear();
  let months = d1.getMonth() - d0.getMonth();
  let days = d1.getDate() - d0.getDate();
  if(days < 0){
    months -= 1;
    const prevMonthLastDay = new Date(d1.getFullYear(), d1.getMonth(), 0).getDate();
    days += prevMonthLastDay;
  }
  if(months < 0){ years -= 1; months += 12; }
  if(years >= 1){
    let parts = [years + (years===1?' year':' years')];
    if(months>0) parts.push(months + (months===1?' month':' months'));
    return parts.join(', ');
  }
  if(months >= 1){
    return months + (months===1?' month, ':' months, ') + days + (days===1?' day':' days');
  }
  return days + (days===1?' day':' days');
}
function dueCountdown(dueDate){
  if(!dueDate) return '';
  const days = Math.round((new Date(dueDate+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
  if(days > 0) return days + (days===1? ' day' : ' days') + ' until due';
  if(days === 0) return 'Due today';
  return Math.abs(days) + (Math.abs(days)===1? ' day' : ' days') + ' overdue';
}
function healthStatus(s, type, intervalDays){
  const matches = s.events.filter(e=>e.type===type).sort((a,b)=>b.date.localeCompare(a.date));
  const last = matches.length ? matches[0].date : null;
  if(!last){
    return {last:null, nextDue:null, overdue:true, text:'Never recorded — due now'};
  }
  const nextDue = addDays(last, intervalDays);
  const days = Math.round((new Date(nextDue+'T00:00:00') - new Date(todayStr()+'T00:00:00'))/86400000);
  const overdue = days < 0;
  let text;
  if(overdue) text = Math.abs(days) + (Math.abs(days)===1?' day':' days') + ' overdue';
  else if(days===0) text = 'Due today';
  else text = 'Due in ' + days + (days===1?' day':' days');
  return {last, nextDue, overdue, text};
}
function computeOverdueItems(){
  let items = [];
  sheepData.forEach(s=>{
    HEALTH_SCHEDULES.forEach(sch=>{
      const hs = healthStatus(s, sch.type, sch.intervalDays);
      if(hs.overdue) items.push({sheepId:s.id, tag:s.tag, type:sch.type, text:hs.text});
    });
  });
  return items;
}
function latestWeight(s){
  if(!s.weightLog.length) return null;
  return s.weightLog[s.weightLog.length-1];
}
function relatedWarning(ram, ewe){
  if(!ram || !ewe) return null;
  if(ram.id === ewe.sireId) return 'This ram is her father.';
  if(ewe.id === ram.damId) return 'This ewe is the ram\'s mother.';
  if(ram.sireId && ewe.sireId && ram.sireId === ewe.sireId) return 'They share the same father — full or half siblings.';
  if(ram.damId && ewe.damId && ram.damId === ewe.damId) return 'They share the same mother — full or half siblings.';
  if(ram.sireId && ram.sireId === ewe.id) return 'This ewe is the ram\'s mother.';
  if(ewe.sireId && ewe.sireId === ram.id) return 'This ram is her father.';
  return null;
}

/* ---------------- Storage ---------------- */
/* ---------------- Storage primitives (generic get/set) ---------------- */
async function storageGet(key){
  try{
    if(window.storage){ const r = await window.storage.get(key); return (r && r.value) ? r.value : null; }
  }catch(e){ /* fall through */ }
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function storageSet(key, value){
  try{
    if(window.storage){ await window.storage.set(key, value); return; }
  }catch(e){ /* fall through */ }
  try{ localStorage.setItem(key, value); }catch(e){ /* no persistence available */ }
}

/* ---------------- Data save/load (plain storage, no PIN) ---------------- */
let transactions = [];
function packState(){ return JSON.stringify({sheep:sheepData, transactions:transactions}); }
function unpackState(jsonStr){
  const parsed = JSON.parse(jsonStr);
  if(Array.isArray(parsed)) return {sheep:parsed, transactions:[]};
  return {sheep:parsed.sheep||[], transactions:parsed.transactions||[]};
}
async function saveData(){
  try{ await storageSet('flock-data', packState()); }catch(e){ /* save failed silently; data stays in memory for this session */ }
}
function maybeAutoShowHealth(){
  if(healthAlertAutoShown) return;
  healthAlertAutoShown = true;
  if(computeOverdueItems().length) healthModalOpen = true;
}
function backfillSeq(){
  let changed = false;
  let next = sheepData.some(s=>s.seq) ? Math.max(...sheepData.map(s=>s.seq||0)) + 1 : 1;
  sheepData.forEach(s=>{
    if(!s.seq){ s.seq = next; next++; changed = true; }
    (s.weightLog||[]).forEach(w=>{ if(!w.id){ w.id = uid(); changed = true; } });
    // "Lamb" is now an age stage only, not a category — move any old lamb records
    // into Female so every animal counts once as either Female or Male.
    // "Wether" has been retired as a category too — fold any existing wethers into Ram.
    if(!CATS[s.category]){ s.category = 'ewe'; changed = true; }
  });
  if(changed) saveData();
}
let authed = true;
let currentPasswordHash = null;
let unlocked = false;
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function enterHomeOrGate(){
  if(currentPasswordHash && !unlocked){
    currentView = 'enterPassword';
  } else {
    currentView = 'home';
    maybeAutoShowHealth();
  }
  render();
}
async function initAuth(){
  const raw = await storageGet('flock-data');
  if(raw){
    try{
      const st = unpackState(raw);
      if(st.sheep && st.sheep.length){ sheepData = st.sheep; transactions = st.transactions; }
      else { seedData(); }
      backfillSeq();
    }catch(e){ seedData(); }
  } else { seedData(); }
  currentPasswordHash = await storageGet('flock-password-hash');
  enterHomeOrGate();
}

/* ---------------- App Password (per-device, optional login gate) ---------------- */
function renderEnterPassword(){
  document.getElementById('backBtn').classList.add('hide');
  document.getElementById('pageTitle').textContent = 'Enter Password';
  document.getElementById('pageSub').textContent = '';
  document.getElementById('main').innerHTML =
    '<div class="card" style="margin-top:16px;">' +
      '<div class="empty" style="padding:0 0 14px; text-align:left;">This app is password-protected. Enter the password to continue.</div>' +
      '<label>Password</label><input type="password" id="app_pw" placeholder="Password" onkeydown="if(event.key===\'Enter\'){handleUnlockPassword();}">' +
      '<div id="app_pw_err" style="color:var(--danger); font-size:12.5px; margin-top:8px;"></div>' +
    '</div>' +
    '<button class="btn btn-primary btn-block" onclick="handleUnlockPassword()">Unlock</button>';
  document.getElementById('modalRoot').innerHTML = '';
}
async function handleUnlockPassword(){
  const val = document.getElementById('app_pw').value;
  const hash = await sha256(val);
  if(hash === currentPasswordHash){
    unlocked = true;
    enterHomeOrGate();
  } else {
    document.getElementById('app_pw_err').textContent = 'Incorrect password. Please try again.';
  }
}
async function persistPasswordHash(hash){
  if(hash===null){ try{ localStorage.removeItem('flock-password-hash'); }catch(e){} }
  else { await storageSet('flock-password-hash', hash); }
}
function renderSetPassword(){
  const hasExisting = !!currentPasswordHash;
  return '<div class="card">' +
    (hasExisting ? '<label>Current password</label><input type="password" id="pw_current" placeholder="Current password">' : '') +
    '<label>New password</label><input type="password" id="pw_new1" placeholder="New password (min 4 characters)">' +
    '<label>Confirm new password</label><input type="password" id="pw_new2" placeholder="Re-enter new password">' +
    '<div id="pw_err" style="color:var(--danger); font-size:12.5px; margin-top:8px;"></div>' +
  '</div>' +
  '<div class="form-actions">' +
    '<button class="btn btn-outline btn-block" onclick="goBack()">Cancel</button>' +
    '<button class="btn btn-primary btn-block" onclick="handleSetPassword()">Save Password</button>' +
  '</div>' +
  (hasExisting ? '<button class="btn btn-danger btn-block" style="margin-top:10px;" onclick="handleRemovePassword()">Remove Password Protection</button>' : '');
}
async function handleSetPassword(){
  const err = document.getElementById('pw_err');
  err.textContent = '';
  if(currentPasswordHash){
    const cur = document.getElementById('pw_current').value;
    const curHash = await sha256(cur);
    if(curHash !== currentPasswordHash){ err.textContent = 'Current password is incorrect.'; return; }
  }
  const p1 = document.getElementById('pw_new1').value;
  const p2 = document.getElementById('pw_new2').value;
  if(p1.length < 4){ err.textContent = 'New password must be at least 4 characters.'; return; }
  if(p1 !== p2){ err.textContent = 'Passwords do not match.'; return; }
  const hash = await sha256(p1);
  currentPasswordHash = hash;
  unlocked = true;
  await persistPasswordHash(hash);
  alert('Password saved.');
  goBack();
}
async function handleRemovePassword(){
  if(!confirm('Remove password protection? Anyone with access to this app will be able to open it without a password.')) return;
  currentPasswordHash = null;
  await persistPasswordHash(null);
  alert('Password protection removed.');
  goBack();
}

  const ewe1 = mkSheep('L-E01','ewe','Dorper','2023-02-10',[ ['2026-06-01',58],['2026-08-01',61] ], 'confirmed');

  const ewe3 = mkSheep('L-E04','ewe','Katahdin','2022-09-01',[ ['2026-07-20',63] ]);
  const young2 = mkSheep('L-R03','ram','Dorper','2026-05-02',[ ['2026-08-01',20] ], null, ram1.id, ewe1.id);
  sheepData = [ewe1, ram1, wether1, ewe2, young1, ewe3, young2];
  sheepData.forEach((s,i)=>{ s.seq = i+1; });
  ewe1.events.push({id:uid(), type:'Deworming', date:'2026-08-10', note:''});
  ewe1.events.push({id:uid(), type:'Pulpy Kidney Vaccine', date:'2025-08-01', note:''});
  ram1.events.push({id:uid(), type:'Pulpy Kidney Vaccine', date:'2026-06-15', note:''});
  transactions = [

    {id:uid(), date:'2026-07-20', type:'Medication', amount:220, note:'Dewormer stock', sheepTag:''},
    {id:uid(), date:'2026-06-15', type:'Vaccine', amount:180, note:'Pulpy kidney vaccine batch', sheepTag:''},
    {id:uid(), date:'2026-05-10', type:'Sheep Bought', amount:1500, note:'New breeding ewe', sheepTag:'L-E04'},
    {id:uid(), date:'2026-08-25', type:'Sheep Sold', amount:2200, note:'Sold wether at market', sheepTag:''}
  ];
}
function computeNextSeq(){
  if(!sheepData.length) return 1;
  return Math.max(...sheepData.map(s=>s.seq||0)) + 1;
}
function sheepNumber(s){
  const idx = sheepData.findIndex(x=>x.id===s.id);
  return idx >= 0 ? idx + 1 : '—';
}
function nextTagNumber(prefix){
  let max = 0;
  sheepData.forEach(s=>{
    if(s.tag && s.tag.indexOf(prefix)===0){
      const num = parseInt(s.tag.slice(prefix.length), 10);
      if(!isNaN(num) && num > max) max = num;
    }
  });
  return max + 1;
}
function suggestTag(category){
  const isMale = (category==='ram' || category==='wether');
  if(isMale){
    return 'L-R' + String(nextTagNumber('L-R')).padStart(2,'0');
  }
  return 'L-E' + String(nextTagNumber('L-E')).padStart(2,'0');
}
function mkSheep(tag,cat,breed,dob,weights,pregStatus,sireId,damId){
  const s = {
    id:uid(), tag, category:cat, breed, dob, notes:'',
    sireId: sireId||null, damId: damId||null,
    stage: computeStage(dob) || 'Adult',
    stageHistory:[{date:dob||todayStr(), stage: computeStage(dob) || 'Adult'}],
    weightLog: weights.map(w=>({id:uid(),date:w[0],weight:w[1]})),
    events:[],
    breedingRecords:[],
    pregnancy:{status:'open',breedingDate:'',dueDate:'',lambCount:0,note:''}
  };
  if(pregStatus){
    const bd = '2026-07-01';
    s.pregnancy = {status:pregStatus, breedingDate:bd, dueDate:addDays(bd,150), lambCount:0, note:''};
    s.breedingRecords.push({id:uid(),date:bd,ramTag:'L-R01',method:'Natural',note:''});
  }
  return s;
}

const PHOTO_MAP = { ram:PHOTO_RAM, ewe:PHOTO_EWE, wether:PHOTO_WETHER, lamb:PHOTO_LAMB, femaleLamb:PHOTO_LAMB, maleLamb:PHOTO_LAMB };
const CAT_COLOR = { ram:'#2F7A45', ewe:'#E08B2A', wether:'#2C7A8B', lamb:'#D9718F', femaleLamb:'#D9718F', maleLamb:'#4A6FA5' };
const SEX_COLOR = { female:'#C6447A', male:'#2E5FA3' };
const SEX_BG = { female:'#FBE3ED', male:'#E1EAF6' };
const CAT_BG = { ram:'#E3F1E7', ewe:'#FBE9D3', wether:'#DCEEF1', lamb:'#FBE1E8', femaleLamb:'#FBE1E8', maleLamb:'#DEE7F2' };
const DISPLAY_LABELS = { ewe:'Female Sheep', ram:'Ram', wether:'Male Sheep', femaleLamb:'Female Lamb', maleLamb:'Male Lamb' };
function displayCategory(s){
  if(s.category==='femaleLamb' || s.category==='maleLamb'){
    if(s.dob && computeStage(s.dob) !== 'Lamb'){
      return s.category==='femaleLamb' ? 'ewe' : 'ram';
    }
    return s.category;
  }
  if(s.stage === 'Lamb') return catSex(s.category)==='female' ? 'femaleLamb' : 'maleLamb';
  return s.category;
}
function displayLabel(key){ return DISPLAY_LABELS[key] || key; }
function countByDisplay(key){ return sheepData.filter(s=>displayCategory(s)===key).length; }
function sheepIcon(category, size){
  size = size || 40;
  const src = PHOTO_MAP[category] || PHOTO_MAP.wether;
  return '<div style="width:'+size+'px;height:'+size+'px;flex:none;overflow:hidden;">' +
    '<img src="'+src+'" alt="'+category+'" style="width:100%;height:100%;object-fit:contain;display:block;"/>' +
  '</div>';
}
const PHOTO_FLAT_MAP = { ram:PHOTO_RAM_FLAT, ewe:PHOTO_EWE_FLAT, wether:PHOTO_WETHER_FLAT, lamb:PHOTO_LAMB_FLAT, femaleLamb:PHOTO_LAMB_FLAT, maleLamb:PHOTO_LAMB_FLAT };
function sheepIconFlat(category, size){
  size = size || 56;
  const src = PHOTO_FLAT_MAP[category] || PHOTO_FLAT_MAP.wether;
  return '<img src="'+src+'" alt="'+category+'" style="width:'+size+'px;height:'+size+'px;flex:none;object-fit:contain;display:block;"/>';
}

function sheepIconFor(s, size){
  // Displays the correct colour + circle for Female Sheep, Male Sheep, Wether,
  // Female Lamb or Male Lamb. Both lamb variants share the same lamb photo.
  return sheepIcon(displayCategory(s), size);
}

/* ---------------- Nav ---------------- */
function navigate(view, params){
  history.push({view:currentView, sheepId:currentSheepId, tab:detailTab});
  currentView = view;
  if(params){
    if(params.sheepId !== undefined) currentSheepId = params.sheepId;
    if(params.tab !== undefined) detailTab = params.tab;
  }
  render();
  window.scrollTo(0,0);
}
function goBack(){
  const prev = history.pop();
  if(!prev){ currentView='home'; render(); return; }
  currentView = prev.view;
  currentSheepId = prev.sheepId;
  detailTab = prev.tab;
  render();
  window.scrollTo(0,0);
}
function goHome(){ history=[]; currentView='home'; render(); window.scrollTo(0,0); }

/* ---------------- Render root ---------------- */
function render(){
  if(currentView==='enterPassword'){ renderEnterPassword(); return; }
  syncStages();
  const titleMap = {
    home:['Flock Manager',''],
    list:['Sheep List', sheepData.length + ' animals'],
    form:[editingSheepId?'Edit Sheep':'Add Sheep',''],
    detail:['Sheep Detail',''],
    weight:['Weight Report',''],
    events:['Events Report',''],
    breeding:['Breeding Reports',''],
    pregnancies:['Pregnant Females',''],
    stage:['Stage Tracking',''],
    family:['Family Groups','Avoid breeding related animals'],
    addEvent:['Log Event',''],
    addBreeding:['Add Breeding Record',''],
    addWeight:['Log Weight',''],
    pickEweBreeding:['Track Pregnancy',''],
    editPregnancy:['Edit Pregnancy',''],
    transactions:['Transactions',''],
    addTransaction:[editingTransactionId?'Edit Transaction':'Add Transaction',''],
    bulkAddEvent:['Log Event — Multiple Sheep',''],
    bulkAddBreeding:['Add Breeding — Multiple Females',''],
    setPassword:[currentPasswordHash?'Change Password':'Set Password','']
  };
  document.getElementById('pageTitle').textContent = titleMap[currentView][0];
  document.getElementById('pageSub').textContent = titleMap[currentView][1];
  document.getElementById('backBtn').classList.toggle('hide', currentView==='home');

  let html = '';
  if(currentView==='home') html = renderHome();
  else if(currentView==='list') html = renderList();
  else if(currentView==='form') html = renderForm();
  else if(currentView==='detail') html = renderDetail();
  else if(currentView==='weight') html = renderWeightReport();
  else if(currentView==='events') html = renderEventsReport();
  else if(currentView==='breeding') html = renderBreedingReport();
  else if(currentView==='pregnancies') html = renderPregnancies();
  else if(currentView==='stage') html = renderStage();
  else if(currentView==='family') html = renderFamily();
  else if(currentView==='addEvent') html = renderAddEvent();
  else if(currentView==='addBreeding') html = renderAddBreeding();
  else if(currentView==='addWeight') html = renderAddWeight();
  else if(currentView==='transactions') html = renderTransactions();
  else if(currentView==='addTransaction') html = renderAddTransaction();
  else if(currentView==='bulkAddEvent') html = renderBulkAddEvent();
  else if(currentView==='bulkAddBreeding') html = renderBulkAddBreeding();
  else if(currentView==='setPassword') html = renderSetPassword();
  else if(currentView==='pickEweBreeding') html = renderPickEweBreeding();
  else if(currentView==='editPregnancy') html = renderEditPregnancy();
  document.getElementById('main').innerHTML = html;
  renderModal();
}
function renderModal(){
  const root = document.getElementById('modalRoot');
  if(!healthModalOpen){ root.innerHTML = ''; return; }
  const items = computeOverdueItems();
  if(!items.length){ healthModalOpen = false; root.innerHTML = ''; return; }
  root.innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this){healthModalOpen=false; render();}">' +
      '<div class="modal-sheet">' +
        '<h3>⚠ Health reminders overdue</h3>' +
        '<div class="sub">'+items.length+' item'+(items.length===1?'':'s')+' need attention across your flock.</div>' +
        items.map(o=>
          '<div class="health-alert-row" style="padding:10px 0; font-size:13.5px;" onclick="healthModalOpen=false; navigate(\'detail\',{sheepId:\''+o.sheepId+'\',tab:\'overview\'})">' +
            '<span><b>'+o.tag+'</b> · '+o.type+'</span><span>'+o.text+'</span>' +
          '</div>'
        ).join('') +
        '<button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="healthModalOpen=false; render();">Got it</button>' +
      '</div>' +
    '</div>';
}

        '<div class="tag" style="font-size:19px;">'+sheepNumber(s)+'</div>' +

function toggleRowMenu(id){
  openMenuId = (openMenuId===id) ? null : id;

function toggleListSelect(id, checked){

}
function deleteSelectedFromList(){
  if(listSelection.size===0) return;
  if(!confirm('Delete '+listSelection.size+' selected sheep? This cannot be undone.')) return;
  sheepData = sheepData.filter(s=>!listSelection.has(s.id));
  listSelection = new Set();
  saveData();
  render();
}
function editSheepFromList(id){
  editingSheepId = id;
  openMenuId = null;
  navigate('form');
}
function deleteSheepById(id){
  if(!confirm('Delete this sheep record? This cannot be undone.')) return;
  sheepData = sheepData.filter(x=>x.id!==id);

  openMenuId = null;
  render();
}

  '<div class="form-actions">' +

  '</div>' +
  (s ? '<button class="btn btn-danger btn-block" style="margin-top:10px;" onclick="deleteSheep()">Delete Sheep</button>' : '');
}
function formCatToRealCategory(c){
  if(c==='femaleLamb') return 'ewe';
  if(c==='maleLamb') return 'ram';
  return c;
}
window._formCat = 'ewe';
window._formSex = 'female';
function stageOptionsHtml(sex, currentCat){
  const opts = sex==='female'
    ? [['ewe','Ewe'],['femaleLamb','Lamb']]
    : [['ram','Ram'],['wether','Wether'],['maleLamb','Lamb']];
  return opts.map(o=>'<option value="'+o[0]+'" '+(currentCat===o[0]?'selected':'')+'>'+o[1]+'</option>').join('');
}
function refreshTagSuggestion(cat){
  if(!editingSheepId && window._tagAutoFilled!==false){
    const tagEl = document.getElementById('f_tag');
    if(tagEl){ tagEl.value = suggestTag(formCatToRealCategory(cat)); window._tagAutoFilled = true; }
  }
}
function selectSex(sex){
  window._formSex = sex;
  window._formCat = sex==='female' ? 'ewe' : 'ram';
  document.getElementById('sex_female').classList.toggle('sel', sex==='female');
  document.getElementById('sex_male').classList.toggle('sel', sex==='male');
  const stageEl = document.getElementById('f_stage');
  if(stageEl) stageEl.innerHTML = stageOptionsHtml(sex, window._formCat);
  refreshTagSuggestion(window._formCat);
}
function selectStage(cat){
  window._formCat = cat;
  refreshTagSuggestion(cat);
}
function saveSheepForm(){
  const tag = document.getElementById('f_tag').value.trim();
  if(!tag){ alert('Please enter a tag number.'); return; }
  const breed = document.getElementById('f_breed').value.trim();
  const dob = document.getElementById('f_dob').value;
  const notes = document.getElementById('f_notes').value.trim();
  const cat = window._formCat || 'ewe';
  const sireId = document.getElementById('f_sire').value || null;
  const damId = document.getElementById('f_dam').value || null;

  if(editingSheepId){
    const s = sheepData.find(x=>x.id===editingSheepId);
    s.tag=tag; s.category=cat; s.breed=breed; s.dob=dob; s.notes=notes; s.sireId=sireId; s.damId=damId;
  } else {
    const wInput = document.getElementById('f_weight');
    const w = wInput ? parseFloat(wInput.value) : NaN;
    const s = {
      id:uid(), tag, category:cat, breed, dob, notes, sireId, damId,
      seq: computeNextSeq(),
      stage: computeStage(dob) || 'Adult',
      stageHistory:[{date:todayStr(), stage: computeStage(dob) || 'Adult'}],
      weightLog: (!isNaN(w) ? [{date:todayStr(), weight:w}] : []),
      events:[], breedingRecords:[],
      pregnancy:{status:'open',breedingDate:'',dueDate:'',lambCount:0,note:''}
    };
    sheepData.push(s);
  }
  saveData();
  editingSheepId = null;
  window._formCat='ewe';
  navigate('list');
}
function deleteSheep(){
  if(!confirm('Delete this sheep record? This cannot be undone.')) return;
  sheepData = sheepData.filter(x=>x.id!==editingSheepId);
  saveData();
  editingSheepId=null;
  goHome();
}

function onBreedingRamChange(){
  const val = document.getElementById('b_ram_id').value;
  document.getElementById('b_ram_ext').style.display = (val==='external') ? '' : 'none';
  const warnDiv = document.getElementById('b_warning');
  const ewe = findSheep();
  const ram = (val && val!=='external') ? sheepData.find(x=>x.id===val) : null;
  const msg = relatedWarning(ram, ewe);
  warnDiv.innerHTML = msg ? '<div style="background:#FBEAE7; border:1px solid #E4B3AA; color:var(--danger); border-radius:9px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:4px;">⚠ Inbreeding risk: '+msg+'</div>' : '';
}
function saveBreeding(){
  const s = findSheep();
  const ramSelVal = document.getElementById('b_ram_id').value;
  let ramTag, ramId = null;
  if(ramSelVal === 'external' || !ramSelVal){
    ramTag = (document.getElementById('b_ram_text') ? document.getElementById('b_ram_text').value.trim() : '') || 'Unknown';
  } else {
    const ram = sheepData.find(x=>x.id===ramSelVal);
    ramTag = ram.tag; ramId = ram.id;
    const msg = relatedWarning(ram, s);
    if(msg && !confirm('⚠ Inbreeding risk: '+msg+'\n\nRecord this breeding anyway?')) return;
  }
  const method = document.getElementById('b_method').value;
  const date = document.getElementById('b_date').value || todayStr();
  const note = document.getElementById('b_note').value.trim();

  if(editingBreedingId){
    const b = s.breedingRecords.find(b=>b.id===editingBreedingId);
    b.date=date; b.ramTag=ramTag; b.ramId=ramId; b.method=method; b.note=note;
    // If this is the ewe's most recent breeding record and she's actively tracked as bred/confirmed,
    // keep her pregnancy dates linked to this date automatically.
    const latest = s.breedingRecords.slice().sort((a,b2)=>b2.date.localeCompare(a.date))[0];
    if(latest && latest.id===b.id && ['bred','confirmed'].includes(s.pregnancy.status)){
      s.pregnancy.breedingDate = date;
      s.pregnancy.dueDate = addDays(date,150);
    }
  } else {
    s.breedingRecords.push({id:uid(), date, ramTag, ramId, method, note});
    s.pregnancy = {status:'bred', breedingDate:date, dueDate:addDays(date,150), lambCount:0, note:''};
  }
  editingBreedingId = null;
  saveData();
  goBack();
}
function deleteBreeding(sheepId, entryId){
  if(!confirm('Delete this breeding record? This will not change her current pregnancy status — adjust that from the Pregnancies screen if needed.')) return;
  const s = sheepData.find(x=>x.id===sheepId);
  s.breedingRecords = s.breedingRecords.filter(b=>b.id!==entryId);
  editingBreedingId = null;
  saveData();
  if(currentView==='addBreeding') goBack(); else render();
}

function updateBulkBreedingWarnings(){
  const extDiv = document.getElementById('bb_ram_ext');
  const ramSel = document.getElementById('bb_ram_id');
  if(!ramSel) return;
  const val = ramSel.value;
  if(extDiv) extDiv.style.display = (val==='external') ? '' : 'none';
  const warnDiv = document.getElementById('bb_warning');
  if(!warnDiv) return;
  const ram = (val && val!=='external') ? sheepData.find(x=>x.id===val) : null;
  if(!ram){ warnDiv.innerHTML=''; return; }
  let msgs = [];
  bulkSelection.forEach(id=>{
    const ewe = sheepData.find(x=>x.id===id);
    if(!ewe) return;
    const msg = relatedWarning(ram, ewe);
    if(msg) msgs.push(ewe.tag+': '+msg);
  });
  warnDiv.innerHTML = msgs.length ? ('<div style="background:#FBEAE7; border:1px solid #E4B3AA; color:var(--danger); border-radius:9px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:4px;">⚠ Inbreeding risk:<br>'+msgs.join('<br>')+'</div>') : '';
}
function saveBulkBreeding(){
  if(bulkSelection.size===0){ alert('Select at least one female.'); return; }
  const ramSelVal = document.getElementById('bb_ram_id').value;
  let ramTag, ramId = null;
  if(ramSelVal === 'external' || !ramSelVal){
    ramTag = (document.getElementById('bb_ram_text') ? document.getElementById('bb_ram_text').value.trim() : '') || 'Unknown';
  } else {
    const ram = sheepData.find(x=>x.id===ramSelVal);
    ramTag = ram.tag; ramId = ram.id;
    let msgs = [];
    bulkSelection.forEach(id=>{
      const ewe = sheepData.find(x=>x.id===id);
      const msg = relatedWarning(ram, ewe);
      if(msg) msgs.push(ewe.tag+': '+msg);
    });
    if(msgs.length && !confirm('⚠ Inbreeding risk detected:\n'+msgs.join('\n')+'\n\nRecord these breedings anyway?')) return;
  }
  const method = document.getElementById('bb_method').value;
  const date = document.getElementById('bb_date').value || todayStr();
  const note = document.getElementById('bb_note').value.trim();
  bulkSelection.forEach(id=>{
    const s = sheepData.find(x=>x.id===id);
    if(!s) return;
    s.breedingRecords.push({id:uid(), date, ramTag, ramId, method, note});
    s.pregnancy = {status:'bred', breedingDate:date, dueDate:addDays(date,150), lambCount:0, note:''};
  });
  saveData();
  bulkSelection = new Set();
  navigate('breeding');
}

/* ---------------- Shared bulk-selection helpers ---------------- */
function toggleBulkSelect(id, checked){
  if(checked) bulkSelection.add(id); else bulkSelection.delete(id);
  const c1 = document.getElementById('bulk_count'); if(c1) c1.textContent = bulkSelection.size;
  const c2 = document.getElementById('bulk_count2'); if(c2) c2.textContent = bulkSelection.size;
}
function bulkSelectAllVisible(){
  document.querySelectorAll('[id^="bulk_chk_"]').forEach(el=>{
    const id = el.id.replace('bulk_chk_','');
    bulkSelection.add(id);
    el.checked = true;
  });
  const c1 = document.getElementById('bulk_count'); if(c1) c1.textContent = bulkSelection.size;
  const c2 = document.getElementById('bulk_count2'); if(c2) c2.textContent = bulkSelection.size;
  if(document.getElementById('bb_warning')) updateBulkBreedingWarnings();
}
function bulkClearAllVisible(){
  document.querySelectorAll('[id^="bulk_chk_"]').forEach(el=>{
    const id = el.id.replace('bulk_chk_','');
    bulkSelection.delete(id);
    el.checked = false;
  });
  const c1 = document.getElementById('bulk_count'); if(c1) c1.textContent = bulkSelection.size;
  const c2 = document.getElementById('bulk_count2'); if(c2) c2.textContent = bulkSelection.size;
  if(document.getElementById('bb_warning')) updateBulkBreedingWarnings();
}

/* ---------------- Pregnancies ---------------- */
function renderPregnancies(){
  const ewes = sheepData.filter(s=>catSex(s.category)==='female' && ['bred','confirmed'].includes(s.pregnancy.status));
  return '<button class="btn btn-primary btn-block fab-add" onclick="navigate(\'pickEweBreeding\')">+ Track Pregnancy</button>' +
  (ewes.length ? ewes.map(s=>{
    return '<div class="card">' +
      '<div class="row-between"><b>'+s.tag+'</b><span class="pill-status st-'+s.pregnancy.status+'">'+s.pregnancy.status+'</span></div>' +
      '<div style="font-size:12.5px; color:var(--muted); margin:6px 0 4px;">Bred '+fmtDate(s.pregnancy.breedingDate)+' · Due '+fmtDate(s.pregnancy.dueDate)+'</div>' +
      '<div style="font-size:13.5px; font-weight:700; color:var(--green-dark); margin-bottom:10px;">'+dueCountdown(s.pregnancy.dueDate)+'</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap;">' +
        (s.pregnancy.status==='bred' ? '<button class="btn btn-outline btn-sm" onclick="confirmPreg(\''+s.id+'\')">Confirm Pregnancy</button>' : '') +
        '<button class="btn btn-outline btn-sm" onclick="navigate(\'editPregnancy\',{sheepId:\''+s.id+'\'})">Edit</button>' +
        '<button class="btn btn-primary btn-sm" onclick="markLambed(\''+s.id+'\')">Mark Lambed</button>' +
        '<button class="btn btn-danger btn-sm" onclick="markOpen(\''+s.id+'\')">Mark Open</button>' +
      '</div>' +
    '</div>';
  }).join('') : '<div class="empty">No females currently marked pregnant. Tap "+ Track Pregnancy" above, or add a breeding record from her profile.</div>');
}
function renderPickEweBreeding(){
  const openEwes = sheepData.filter(s=>catSex(s.category)==='female' && s.pregnancy.status==='open');
  return '<div class="empty" style="padding:0 4px 14px; text-align:left;">Pick a female to record a breeding for. This will mark her as bred and start tracking her pregnancy.</div>' +
  (openEwes.length ? openEwes.map(s=>
    '<div class="sheep-item" onclick="editingBreedingId=null; navigate(\'addBreeding\',{sheepId:\''+s.id+'\'})">' +
      sheepIcon('ewe',42) +
      '<div class="info"><div class="tag">'+s.tag+'</div><div class="sub">'+(s.breed||'Unknown breed')+' · '+ageStr(s.dob)+'</div></div>' +
      '<div class="chev">›</div>' +
    '</div>'
  ).join('') : '<div class="empty">No open ewes available — every ewe is already pregnant or lambed.</div>');
}
function renderEditPregnancy(){
  const s = findSheep();
  const p = s.pregnancy;
  return '<div class="card">' +
    '<label>Female</label><input type="text" value="'+s.tag+'" disabled>' +
    '<label>Status</label><select id="p_status">' +
      ['open','bred','confirmed','lambed'].map(st=>'<option value="'+st+'" '+(p.status===st?'selected':'')+'>'+st+'</option>').join('') +
    '</select>' +
    '<label>Breeding date</label><input type="date" id="p_bred" value="'+(p.breedingDate||'')+'">' +
    '<label>Expected due date</label><input type="date" id="p_due" value="'+(p.dueDate||'')+'">' +
    '<label>Note (optional)</label><textarea id="p_note">'+(p.note||'')+'</textarea>' +
  '</div>' +
  '<div class="form-actions">' +
    '<button class="btn btn-outline btn-block" onclick="goBack()">Cancel</button>' +
    '<button class="btn btn-primary btn-block" onclick="savePregnancyEdit()">Save</button>' +
  '</div>';
}
function savePregnancyEdit(){
  const s = findSheep();
  const status = document.getElementById('p_status').value;
  const breedingDate = document.getElementById('p_bred').value;
  const dueDate = document.getElementById('p_due').value;
  const note = document.getElementById('p_note').value.trim();
  s.pregnancy = {status, breedingDate, dueDate, lambCount:s.pregnancy.lambCount||0, note};
  saveData();
  goBack();
}

/* ---------------- Transactions ---------------- */
function renderTransactions(){
  const sorted = transactions.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const income = transactions.filter(t=>txIsIncome(t.type)).reduce((sum,t)=>sum+Number(t.amount||0),0);
  const expense = transactions.filter(t=>!txIsIncome(t.type)).reduce((sum,t)=>sum+Number(t.amount||0),0);
  const net = income - expense;
  return '' +
  '<button class="btn btn-primary btn-block fab-add" onclick="editingTransactionId=null; navigate(\'addTransaction\')">+ Add Transaction</button>' +
  '<div class="kv-grid">' +
    '<div class="kv"><div class="k">Total Income</div><div class="v" style="color:var(--green-dark); font-size:14px;">'+formatLSL(income)+'</div></div>' +
    '<div class="kv"><div class="k">Total Expenses</div><div class="v" style="color:var(--danger); font-size:14px;">'+formatLSL(expense)+'</div></div>' +
  '</div>' +
  '<div class="card" style="text-align:center; background:'+(net>=0?'var(--green-soft)':'#FBEAE7')+';">' +
    '<div style="font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase;">Net Profit / Loss</div>' +
    '<div style="font-family:-apple-system, BlinkMacSystemFont, \'Segoe UI\', Roboto, Helvetica, Arial, sans-serif; font-size:26px; font-weight:700; color:'+(net>=0?'var(--green-dark)':'var(--danger)')+';">'+(net<0?'-':'')+formatLSL(Math.abs(net))+'</div>' +
  '</div>' +
  '<div class="card">' +
  (sorted.length ? sorted.map(t=>{
    const inc = txIsIncome(t.type);
    return '<div class="log-item"><span>' +
        '<span style="color:'+(inc?'var(--green-dark)':'var(--danger)')+'; font-weight:700;">'+(inc?'+':'-')+formatLSL(t.amount)+'</span>' +
        ' — '+t.type+(t.sheepTag?' ('+t.sheepTag+')':'')+(t.note?' · '+t.note:'') +
      '</span>' +
      '<span style="display:flex; align-items:center; gap:10px;">' +
        '<span class="d">'+fmtDate(t.date)+'</span>' +
        '<button class="dot-btn" style="font-size:14px;" onclick="editingTransactionId=\''+t.id+'\'; navigate(\'addTransaction\')">✎</button>' +
        '<button class="dot-btn" style="font-size:14px; color:var(--danger);" onclick="deleteTransaction(\''+t.id+'\')">🗑</button>' +
      '</span></div>';
  }).join('') : '<div class="empty">No transactions recorded yet.</div>') +
  '</div>';
}
function renderAddTransaction(){
  const editing = editingTransactionId ? transactions.find(t=>t.id===editingTransactionId) : null;
  return '<div class="card">' +
    '<label>Type</label>' +
    '<select id="t_type">' + TX_TYPES.map(t=>'<option value="'+t.type+'" '+(editing&&editing.type===t.type?'selected':'')+'>'+t.type+' ('+(t.income?'Income':'Expense')+')</option>').join('') + '</select>' +
    '<label>Amount (LSL)</label><input type="number" id="t_amount" placeholder="e.g. 850" value="'+(editing?editing.amount:'')+'">' +
    '<label>Date</label><input type="date" id="t_date" value="'+(editing?editing.date:todayStr())+'">' +
    '<label>Related sheep tag (optional)</label><input type="text" id="t_sheeptag" placeholder="e.g. A105" value="'+(editing?editing.sheepTag||'':'')+'">' +
    '<label>Note (optional)</label><textarea id="t_note" placeholder="Details…">'+(editing?editing.note||'':'')+'</textarea>' +
  '</div>' +
  '<div class="form-actions">' +
    '<button class="btn btn-outline btn-block" onclick="editingTransactionId=null; goBack()">Cancel</button>' +
    '<button class="btn btn-primary btn-block" onclick="saveTransaction()">Save</button>' +
  '</div>' +
  (editing ? '<button class="btn btn-danger btn-block" style="margin-top:10px;" onclick="deleteTransaction(\''+editing.id+'\')">Delete Transaction</button>' : '');
}
function saveTransaction(){
  const type = document.getElementById('t_type').value;
  const amount = parseFloat(document.getElementById('t_amount').value);
  const date = document.getElementById('t_date').value || todayStr();
  const sheepTag = document.getElementById('t_sheeptag').value.trim();
  const note = document.getElementById('t_note').value.trim();
  if(isNaN(amount) || amount < 0){ alert('Enter a valid amount.'); return; }
  if(editingTransactionId){
    const t = transactions.find(t=>t.id===editingTransactionId);
    t.type=type; t.amount=amount; t.date=date; t.sheepTag=sheepTag; t.note=note;
  } else {
    transactions.push({id:uid(), type, amount, date, sheepTag, note});
  }
  editingTransactionId = null;
  saveData();
  goBack();
}
function deleteTransaction(id){
  if(!confirm('Delete this transaction?')) return;
  transactions = transactions.filter(t=>t.id!==id);
  editingTransactionId = null;
  saveData();
  if(currentView==='addTransaction') goBack(); else render();
}
function confirmPreg(id){
  const s = sheepData.find(x=>x.id===id);
  s.pregnancy.status='confirmed';
  saveData(); render();
}
function markLambed(id){
  const s = sheepData.find(x=>x.id===id);
  const n = prompt('How many lambs were born?','1');
  if(n===null) return;
  const count = parseInt(n)||0;
  s.events.push({id:uid(), type:'Other', date:todayStr(), note:'Lambed — '+count+' lamb(s)'});
  s.pregnancy = {status:'open', breedingDate:'', dueDate:'', lambCount:count, note:''};
  saveData(); render();
}
function markOpen(id){
  const s = sheepData.find(x=>x.id===id);
  s.pregnancy = {status:'open', breedingDate:'', dueDate:'', lambCount:0, note:''};
  saveData(); render();
}

/* ---------------- Stage Tracking ---------------- */
function renderStage(){
  return '<div class="empty" style="padding:0 4px 14px; text-align:left;">Stages update automatically from each sheep\'s date of birth. Sheep with no recorded date of birth can be set manually.</div>' +
  STAGES.map(stage=>{
    const group = sheepData.filter(s=>s.stage===stage);
    return '<div class="stage-group"><h3>'+stageFull(stage)+' — '+group.length+'</h3>' +
    (group.length ? group.map(s=>{
      return '<div class="sheep-item" style="cursor:default;">' +
        sheepIconFor(s,42) +
        '<div class="info"><div class="tag">'+s.tag+'</div><div class="sub">'+CATS[s.category].label+' · '+ageStr(s.dob)+'</div></div>' +
        (s.dob ?
          '<span style="font-size:11px; color:var(--muted); font-weight:700; text-align:right; flex:none; width:70px;">AUTO</span>' :
          '<div class="select-wrap" style="flex:none; width:150px;"><select onchange="setStage(\''+s.id+'\',this.value)">' +
            STAGES.map(st=>'<option value="'+st+'" '+(st===s.stage?'selected':'')+'>'+stageLabel(st)+'</option>').join('') +
          '</select></div>'
        ) +
      '</div>';
    }).join('') : '<div class="empty">No sheep in this stage.</div>') +
    '</div>';
  }).join('');
}
function setStage(id, newStage){
  const s = sheepData.find(x=>x.id===id);
  if(s.stage === newStage) return;
  s.stage = newStage;
  s.stageHistory.push({date:todayStr(), stage:newStage});
  saveData(); render();
}
function advanceStage(id){
  const s = sheepData.find(x=>x.id===id);
  const idx = STAGES.indexOf(s.stage);
  if(idx < STAGES.length-1){
    s.stage = STAGES[idx+1];
    s.stageHistory.push({date:todayStr(), stage:s.stage});
    saveData(); render();
  }
}

/* ---------------- Family Groups ---------------- */
function renderFamily(){
  const groups = {};
  sheepData.forEach(s=>{
    if(s.sireId || s.damId){
      const key = (s.sireId||'unk')+'|'+(s.damId||'unk');
      if(!groups[key]) groups[key] = {sireId:s.sireId, damId:s.damId, children:[]};
      groups[key].children.push(s);
    }
  });
  const keys = Object.keys(groups);
  const orphans = sheepData.filter(s=>!s.sireId && !s.damId);

  let html = '<div class="empty" style="padding:0 4px 14px; text-align:left;">Full and half siblings are grouped under their father and mother. When recording a new breeding, the app checks for these relationships and warns before you save.</div>';

  if(!keys.length){
    html += '<div class="empty">No parentage recorded yet. Add a father and mother when adding or editing a sheep to start building family groups.</div>';
  } else {
    keys.forEach(key=>{
      const g = groups[key];
      const sire = g.sireId ? sheepData.find(x=>x.id===g.sireId) : null;
      const dam = g.damId ? sheepData.find(x=>x.id===g.damId) : null;
      html += '<div class="card">' +
        '<div style="display:flex; gap:8px; margin-bottom:10px;">' +
          '<div class="sheep-item" style="flex:1; margin-bottom:0;" onclick="'+(sire?'navigate(\'detail\',{sheepId:\''+sire.id+'\',tab:\'overview\'})':'')+'">' +
            (sire?sheepIcon('ram',34):'<div style="width:34px;"></div>') +
            '<div class="info"><div class="sub" style="font-size:11px;">Father</div><div class="tag" style="font-size:13.5px;">'+(sire?sire.tag:'Unknown')+'</div></div>' +
          '</div>' +
          '<div class="sheep-item" style="flex:1; margin-bottom:0;" onclick="'+(dam?'navigate(\'detail\',{sheepId:\''+dam.id+'\',tab:\'overview\'})':'')+'">' +
            (dam?sheepIcon('ewe',34):'<div style="width:34px;"></div>') +
            '<div class="info"><div class="sub" style="font-size:11px;">Mother</div><div class="tag" style="font-size:13.5px;">'+(dam?dam.tag:'Unknown')+'</div></div>' +
          '</div>' +
        '</div>' +
        '<div class="sub" style="margin-bottom:6px;">'+g.children.length+' offspring (siblings — avoid breeding these together)</div>' +
        g.children.map(c=>'<div class="log-item" style="cursor:pointer;" onclick="navigate(\'detail\',{sheepId:\''+c.id+'\',tab:\'overview\'})"><span>'+c.tag+' <span style="color:var(--muted); font-weight:400;">('+CATS[c.category].label+')</span></span><span class="d">'+ageStr(c.dob)+'</span></div>').join('') +
      '</div>';
    });
  }

  if(orphans.length){
    html += '<div class="card"><b style="font-size:13.5px;">No recorded parents</b><div style="margin-top:6px;">' +
      orphans.map(s=>'<div class="log-item" style="cursor:pointer;" onclick="navigate(\'detail\',{sheepId:\''+s.id+'\',tab:\'overview\'})"><span>'+s.tag+' <span style="color:var(--muted); font-weight:400;">('+CATS[s.category].label+')</span></span></div>').join('') +
    '</div></div>';
  }
  return html;
}
